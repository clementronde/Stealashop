<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <rect width="760" height="560" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#222">Panneaux et tapis, vue de dessus (repère du gabarit, 1 stud = 4 px, porte en bas)</text>
  <!-- Avant -->
  <g transform="translate(60,60)">
    <text x="0" y="0" font-weight="bold" fill="#222">Aujourd'hui</text>
    <!-- boutique 48x48 : x -24..24 -> 0..192 ; z 8..-40 -> y 20..212 -->
    <rect x="0" y="20" width="192" height="192" fill="#d9d2f5" stroke="#6b4fd1" stroke-width="2"/>
    <line x1="56" y1="212" x2="136" y2="212" stroke="#222" stroke-width="4"/>
    <text x="96" y="228" text-anchor="middle" fill="#222">porte z −40</text>
    <!-- StageUpgradePoint z -18.6 -> y = 20 + (8+18.6)*4 = 126.4 -->
    <rect x="86" y="122" width="20" height="5" fill="#c0392b"/>
    <text x="112" y="128" fill="#c0392b">panneau boutique z −18,6</text>
    <!-- tapis frame x -27.4..-20.6 -> -13.6..13.6 ; z -41.7..-50.3 -> y 218.8..253.2 -->
    <rect x="-13.6" y="218.8" width="27.2" height="34.4" fill="#555" opacity="0.8"/>
    <text x="-14" y="268" fill="#333">tapis (1,7 stud de la façade)</text>
    <!-- sign x -15.6 z -50 -> x 33.6 y 248 -->
    <rect x="24" y="246" width="18" height="4" fill="#e67e22"/>
    <text x="46" y="252" fill="#e67e22">son panneau</text>
  </g>
  <!-- Après -->
  <g transform="translate(420,60)">
    <text x="0" y="0" font-weight="bold" fill="#0a6b3a">Proposition</text>
    <rect x="0" y="20" width="192" height="192" fill="#cfeedd" stroke="#0a8a4a" stroke-width="2"/>
    <line x1="56" y1="212" x2="136" y2="212" stroke="#222" stroke-width="4"/>
    <text x="96" y="228" text-anchor="middle" fill="#222">porte z −40</text>
    <!-- StageUpgradePoint z 5.6 -> y = 20 + 2.4*4 = 29.6 -->
    <rect x="86" y="27" width="20" height="5" fill="#c0392b"/>
    <text x="96" y="46" text-anchor="middle" fill="#c0392b">panneau boutique au fond, z 5,6</text>
    <text x="96" y="60" text-anchor="middle" fill="#c0392b" font-size="11">(niveaux 2 à 5 : StageUpgradePoint_2, déjà au fond)</text>
    <!-- tapis +10 studs vers l'avant : y +40 -->
    <rect x="-13.6" y="258.8" width="27.2" height="34.4" fill="#555" opacity="0.8"/>
    <rect x="24" y="286" width="18" height="4" fill="#e67e22"/>
    <text x="46" y="292" fill="#e67e22">son panneau, z −60</text>
    <line x1="-20" y1="212" x2="-20" y2="258.8" stroke="#0a8a4a"/>
    <text x="-24" y="240" text-anchor="end" fill="#0a8a4a">11,7</text>
    <text x="-14" y="310" fill="#333">tapis 10 studs plus loin de la façade</text>
  </g>
  <text x="20" y="420" fill="#333">Tapis et panneau avancent ensemble de 10 studs vers la place (même x, même rotation). Testé dans les 6 boutiques du hub :</text>
  <text x="20" y="440" fill="#333">la zone d'usage du tapis et son panneau ne touchent rien (voisines, stands, roue, leaderboards). DepositZone est dans la boutique, loin derrière.</text>
  <text x="20" y="460" fill="#333">L'aperçu en Edit Preview_Treadmill (Workspace/_PREVIEW_UpgradeSigns) avance avec eux.</text>
</svg>
